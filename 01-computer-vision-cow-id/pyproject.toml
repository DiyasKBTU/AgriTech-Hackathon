[project]
name = "cowid"
version = "0.2.0"
description = "COW ID: идентификация КРС по камере и контроль индивидуальной активности"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26", "opencv-python-headless>=4.9", "scipy>=1.11", "pyyaml>=6.0",
    "pydantic>=2.5", "fastapi>=0.110", "uvicorn[standard]>=0.27", "typer>=0.12", "rich>=13.7",
]

[project.optional-dependencies]
ml = ["ultralytics>=8.3", "pillow>=10.0", "imageio-ffmpeg>=0.5", "motmetrics>=1.4"]
ocr = ["easyocr>=1.7"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
cowid = "cowid.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cowid = ["api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
