# Запуск на площадке:
#   docker compose -f deploy/docker-compose.yml up -d console
# Обработать запись за сутки:
#   docker compose -f deploy/docker-compose.yml run --rm worker \
#     process /app/data/recordings/2026-09-16.mp4 --day 2026-09-16
services:
  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cowid:latest
    ports:
      - "8000:8000"
    volumes:
      - ../var:/app/var
      - ../models:/app/models
      - ../configs:/app/configs
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Обработка видео: запускается по расписанию (раз в сутки) или вручную.
  worker:
    image: cowid:latest
    entrypoint: ["cowid"]
    volumes:
      - ../var:/app/var
      - ../models:/app/models
      - ../configs:/app/configs
      - ../data:/app/data
    profiles: ["jobs"]
